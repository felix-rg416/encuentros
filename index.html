<!DOCTYPE html>

<head>

</head>

<body>
  <div class="contenedor">
    <div class="lienzo-wrapper">
      <div id="p5-container"></div>

    <div class="controles">
      <input type="range" id="scrubber" min="0" max="0" value="0" step="1">

      <button id="btn-grabar" class="boton boton-primario">
        <span class="etiqueta">Iniciar grabación</span>
        <span class="indicador"></span>
      </button>

      <button id="btn-detener" class="boton boton-secundario" disabled>
        Detener y descargar
      </button>
    </div>
  </div>

  <script src="esc_explosion_2.js"></script>
  <script src="esc_resalta_x.js"></script>
  <script src="esc_resalta_c.js"></script>
  <script src="esc_tipo_saludo.js"></script>
  <script src="esc_quien_inicia.js"></script>
  <script src="esc_texto.js"></script>

  <script src="esc_pausa.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
